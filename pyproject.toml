[project]
name = "organic-social-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "truststore>=0.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "msal>=1.28",            # Microsoft Graph (OneDrive content library)
    "slack-sdk>=3.27",       # Slack approval UI (Block Kit + interactivity)
    "boto3>=1.34",           # S3/Cloudflare R2 — media staging for the Meta publish flow
    "asyncpg>=0.29",         # Postgres — the scheduler queue
    "apscheduler>=3.10",     # cron loop that fires due+approved posts
    "pillow>=10.0",          # image compression for the vision pass
    "pymupdf>=1.24",         # rasterize PDF creatives → page images (no system binary)
    "imageio-ffmpeg>=0.5",   # bundled ffmpeg binary — video frame sampling (no system install)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/organic_social_agent"]

[project.scripts]
serve         = "organic_social_agent.server:main"
meta-auth     = "organic_social_agent.publishing.meta_auth:main"
report        = "organic_social_agent.reporting.report:main"
index-library = "organic_social_agent.library.index:main"
propose-week  = "organic_social_agent.curation.recommender:main"
worker        = "organic_social_agent.scheduler.worker:main"
